<title>Own Terra se mudó</title>
<link rel="canonical" href="https://safe-ports.github.io/safe-ports-ownterra-website/">
<script>
  // El sitio cambió de dirección: conserva la página, la query y el ancla.
  // Este mismo archivo se publica como 404.html, así que cualquier ruta vieja
  // (/safe-ports-website/aviso-privacidad.html#arco) llega a su equivalente.
  (function () {
    var OLD = "/safe-ports-website";
    var NEW = "https://safe-ports.github.io/safe-ports-ownterra-website";
    var path = location.pathname.indexOf(OLD) === 0 ? location.pathname.slice(OLD.length) : "/";
    location.replace(NEW + (path || "/") + location.search + location.hash);
  })();
</script>
